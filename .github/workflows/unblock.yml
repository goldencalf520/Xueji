name: 自动解锁依赖 issue

# issue 关闭时：找到正文里写了 "Blocked by #<本 issue>" 的开放 issue，
# 若其全部依赖都已关闭，则把 status:blocked 换成 status:ready，并留言通知可以认领。
on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const closed = context.payload.issue.number;
            const { owner, repo } = context.repo;
            const candidates = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'status:blocked', per_page: 100,
            });
            for (const issue of candidates) {
              const deps = [...(issue.body ?? '').matchAll(/Blocked by #(\d+)/g)].map((m) => Number(m[1]));
              if (!deps.includes(closed)) continue;
              const states = await Promise.all(deps.map((n) =>
                github.rest.issues.get({ owner, repo, issue_number: n }).then((r) => r.data.state)));
              if (states.every((s) => s === 'closed')) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'status:blocked' }).catch(() => {});
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['status:ready'] });
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `🔓 依赖已全部关闭（最后一个：#${closed}），状态改为 status:ready，可以认领。` });
              }
            }
